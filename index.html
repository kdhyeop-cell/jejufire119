<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>제주소방서 현장대응단 - 실시간 지휘 상황판</title>
    
    <!-- 프리미엄 UI 폰트 (Pretendard) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <!-- 파이어베이스 라이브러리 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; 
            background: radial-gradient(circle at 50% 10%, #111827 0%, #070a12 100%);
            color: #f1f5f9; 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            min-height: 100vh; overflow-x: hidden;
            position: relative;
            letter-spacing: -0.2px;
        }

        /* 🚒 좌측 지휘관 배경 캐릭터 (HUD 자연스러운 블렌딩) */
        #bg-captain {
            position: fixed;
            top: 50%;
            left: -40px;
            transform: translateY(-50%);
            height: 70vh;
            max-height: 640px;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            filter: drop-shadow(8px 0 25px rgba(0,0,0,0.8));
            opacity: 0.88;
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            display: block;
        }

        @media screen and (max-width: 1450px) {
            #bg-captain { display: none !important; }
        }
        
        /* 상단 좌측 그룹 */
        #top-left-group {
            position: fixed; top: 12px; left: 12px;
            display: flex; align-items: center; gap: 8px; z-index: 100;
        }

        /* DB 초기화 버튼 */
        #btn-clear-data {
            padding: 6px 10px;
            background: rgba(153, 27, 27, 0.4); color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: 700;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        #btn-clear-data:hover { 
            background: #dc2626; color: #fff; 
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
        }

        /* 심볼 및 소방서명 브랜딩 */
        #header-branding {
            display: flex; align-items: center; gap: 7px;
            background: rgba(15, 23, 42, 0.75); padding: 4px 10px; border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }
        #header-branding img { width: 20px; height: 20px; object-fit: contain; }
        #header-branding span { color: #f8fafc; font-size: 11.5px; font-weight: 700; white-space: nowrap; letter-spacing: 0.3px; }

        /* 상단 상태 바 */
        #status-board {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 13.5px; font-weight: 800; text-align: center;
            background: rgba(22, 101, 52, 0.85); padding: 7px 18px;
            border-radius: 20px; width: 42%; max-width: 300px;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2), inset 0 1px 0 rgba(255,255,255,0.2);
            border: 1px solid rgba(74, 222, 128, 0.4);
            letter-spacing: 0.5px;
            backdrop-filter: blur(12px);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            z-index: 100;
        }
        #status-board.alert-level-1 { 
            background: rgba(185, 28, 28, 0.9);
            border-color: #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
            animation: pulse-glow 1.2s infinite; 
        }
        @keyframes pulse-glow { 
            50% { opacity: 0.85; box-shadow: 0 0 35px rgba(239, 68, 68, 0.9); transform: translateX(-50%) scale(1.02); } 
        }

        /* 상단 우측 그룹 */
        #top-right-group {
            position: fixed; top: 12px; right: 12px;
            display: flex; align-items: center; gap: 6px; z-index: 110;
        }

        #btn-download-hwp {
            padding: 6px 11px;
            background: rgba(6, 78, 59, 0.6); color: #6ee7b7; 
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: 700;
            display: flex; align-items: center; gap: 4px; 
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        #btn-download-hwp:hover { background: #059669; color: #fff; box-shadow: 0 0 12px rgba(16, 185, 129, 0.4); }

        #btn-lock-mode {
            padding: 6px 11px;
            background: rgba(15, 23, 42, 0.7); color: #38bdf8; 
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: 700;
            display: flex; align-items: center; gap: 4px;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }
        #btn-lock-mode.active-locked {
            background: rgba(153, 27, 27, 0.8); color: #fecaca; border-color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        /* 메인 컨테이너 */
        #main-container {
            position: absolute; top: 60px; bottom: 180px; left: 18px; right: 18px;
            display: flex; gap: 16px; z-index: 10;
            max-width: 1600px; margin: 0 auto;
            transition: bottom 0.3s ease;
        }

        /* 글래스모피즘 패널 공통 */
        .panel-box {
            flex: 1; 
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            min-width: 0;
        }

        .panel-header {
            padding: 10px 14px; color: #fff; font-size: 13.5px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            letter-spacing: 0.3px; flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0) 100%);
        }

        /* 1. 좌측: 현장 정보 요약 */
        #overview-panel { border-top: 2px solid #0d9488; }
        #overview-panel .panel-header { color: #5eead4; }
        .overview-content { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 12px; }
        .ov-section-title { 
            font-size: 11.5px; font-weight: 800; color: #2dd4bf; 
            margin: 10px 0 6px 0; padding-bottom: 4px;
            border-bottom: 1px solid rgba(45, 212, 191, 0.15);
            letter-spacing: 0.5px;
        }
        .ov-section-title:first-child { margin-top: 0; }
        .ov-row { display: flex; align-items: stretch; margin-bottom: 6px; gap: 8px; }
        .ov-label { width: 62px; color: #94a3b8; font-weight: 600; flex-shrink: 0; display: flex; align-items: center; font-size: 11.5px; }
        .ov-input { 
            flex: 1; background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.08); color: #f8fafc; 
            padding: 6px 10px; border-radius: 6px; font-size: 12px; 
            resize: vertical; min-height: 28px; max-height: 70px;
            font-family: inherit; line-height: 1.4;
            transition: all 0.2s ease;
        }
        .ov-input:focus { outline: none; border-color: #2dd4bf; background: rgba(30, 41, 59, 0.85); box-shadow: 0 0 8px rgba(45, 212, 191, 0.2); }

        .weather-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 6px; margin-bottom: 2px; }
        .weather-box { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 6px; padding: 5px 2px; text-align: center; }
        .weather-title { font-size: 10px; color: #64748b; font-weight: 600; margin-bottom: 2px; }
        .weather-input { background: transparent; border: none; color: #5eead4; text-align: center; width: 100%; font-size: 11.5px; font-weight: 700; font-family: inherit; }
        .weather-input:focus { outline: none; background: rgba(255,255,255,0.06); border-radius: 3px; }

        /* 2. 가운데: 타임라인 */
        #log-panel { border-top: 2px solid #ef4444; }
        #log-panel .panel-header { color: #fca5a5; }
        .log-scroll-area { flex: 1; overflow-y: auto; padding: 12px 14px; }
        .log-entry { 
            display: flex; justify-content: space-between; align-items: flex-start; 
            margin-bottom: 7px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); padding-bottom: 7px; 
            font-size: 12px; gap: 8px;
        }
        .log-content { flex: 1; display: flex; align-items: flex-start; gap: 8px; }
        .log-time { 
            color: #f87171; font-weight: 700; font-size: 11px; 
            flex-shrink: 0; white-space: nowrap; margin-top: 1px; font-variant-numeric: tabular-nums;
        }
        .edit-time { cursor: text; border-bottom: 1px dashed rgba(248, 113, 113, 0.5); display: inline-block; min-width: 48px; text-align: center; }
        .edit-time:focus { background: rgba(255, 255, 255, 0.1); outline: none; border-radius: 3px; }
        .log-msg { flex: 1; word-break: keep-all; line-height: 1.4; color: #e2e8f0; }
        .btn-delete-log { 
            background: rgba(127, 29, 29, 0.3); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); 
            border-radius: 4px; cursor: pointer; font-size: 10px; padding: 2px 5px; 
            margin-left: 4px; white-space: nowrap; flex-shrink: 0; font-weight: 600;
            transition: all 0.15s ease;
        }
        .btn-delete-log:hover { background: #dc2626; color: white; border-color: #ef4444; }

        /* 3. 우측: 현장 도착 현황 */
        #arrived-vehicles-panel { border-top: 2px solid #3b82f6; }
        .avp-header { 
            padding: 9px 12px; color: #93c5fd;
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.06); flex-shrink: 0; gap: 6px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0) 100%);
        }
        #total-veh-badge {
            background: rgba(245, 158, 11, 0.15); color: #fbbf24; padding: 3px 8px;
            border-radius: 12px; font-size: 11px; font-weight: 800; border: 1px solid rgba(251,191,36,0.3);
            white-space: nowrap; flex-shrink: 0; font-variant-numeric: tabular-nums;
        }
        .avp-header-title {
            text-align: center; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            font-size: 13.5px; font-weight: 700; color: #93c5fd;
        }
        #btn-top-add-veh {
            background: rgba(2, 132, 199, 0.3); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 6px;
            padding: 3px 9px; font-size: 11px; font-weight: 700; cursor: pointer;
            transition: all 0.2s ease; white-space: nowrap; flex-shrink: 0;
        }
        #btn-top-add-veh:hover { background: #0284c7; color: white; box-shadow: 0 0 10px rgba(2, 132, 199, 0.4); }
        .avp-content { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 12px; display: flex; flex-direction: column; }
        .avp-list-scroll { flex: 1; overflow-y: auto; }
        .avp-category { font-weight: 700; color: #f59e0b; margin-top: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); padding-bottom: 3px; font-size: 11.5px; letter-spacing: 0.3px; }
        .avp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 6px; margin-bottom: 8px; }
        .avp-item { 
            background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 6px; 
            padding: 6px 2px; text-align: center; color: #38bdf8; font-size: 11.5px; font-weight: 700; 
            cursor: pointer; transition: all 0.15s ease; position: relative;
        }
        .avp-item:hover { background: #991b1b; border-color: #ef4444; color: #fff; box-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
        .avp-item:hover::after { content: " ×"; font-size: 12px; font-weight: bold; color: #fca5a5; }

        #mobile-bottom-spacer { display: none; }

        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        /* 🔒 화면 잠금(조회 전용) 모드 */
        body.locked-mode input, body.locked-mode textarea, body.locked-mode .edit-time {
            pointer-events: none !important; user-select: none !important;
            background: rgba(30, 41, 59, 0.3) !important; border-color: rgba(255,255,255,0.03) !important; color: #94a3b8 !important;
        }
        body.locked-mode .btn-delete-log { display: none !important; }
        body.locked-mode .avp-item { pointer-events: none !important; cursor: default !important; }
        body.locked-mode .avp-item:hover::after { content: "" !important; }
        body.locked-mode #btn-top-add-veh, body.locked-mode #btn-clear-data, body.locked-mode #btn-download-hwp,
        body.locked-mode .quick-actions button, body.locked-mode .btn-send {
            pointer-events: none !important; opacity: 0.3 !important; cursor: not-allowed !important;
        }

        /* 📱 바형 스마트폰 전용 레이아웃 */
        @media screen and (max-width: 900px) {
            body { height: auto !important; min-height: 100vh; overflow-y: auto !important; -webkit-overflow-scrolling: touch; }
            #main-container {
                position: relative !important; top: 52px !important; bottom: auto !important;
                left: 0 !important; right: 0 !important; width: calc(100% - 16px) !important; max-width: calc(100% - 16px) !important;
                margin: 0 auto !important; flex-direction: column !important; height: auto !important; gap: 14px !important; 
            }
            #log-panel { order: 1; height: 280px !important; flex: none; display: flex; flex-direction: column; overflow: hidden; }
            #log-panel .log-scroll-area { flex: 1; overflow-y: auto !important; }
            #arrived-vehicles-panel { order: 2; height: auto !important; flex: none; overflow: hidden !important; }
            #arrived-vehicles-panel .avp-content, #arrived-vehicles-panel .avp-list-scroll { overflow: visible !important; height: auto !important; max-height: none !important; }
            #overview-panel { order: 3; height: auto !important; flex: none; overflow: hidden !important; }
            #overview-panel .overview-content { overflow: visible !important; height: auto !important; max-height: none !important; padding: 10px 12px 14px 12px !important; }
            #mobile-bottom-spacer { display: block !important; order: 4; height: 185px; flex-shrink: 0; width: 100%; pointer-events: none; }
            #header-branding span { display: none; } 
            #header-branding { padding: 4px 6px; }
            #status-board { width: 38%; font-size: 11px; padding: 5px 8px; top: 10px; left: 50% !important; transform: translateX(-50%) !important; }
            #btn-clear-data { padding: 5px 7px; font-size: 9.5px; }
            #btn-download-hwp { padding: 5px 7px; font-size: 9.5px; }
            #btn-lock-mode { padding: 5px 7px; font-size: 9.5px; }

            body.mobile-typing { overflow: hidden !important; }
            body.mobile-typing #overview-panel, body.mobile-typing #arrived-vehicles-panel, body.mobile-typing #mobile-bottom-spacer { display: none !important; }
            body.mobile-typing #main-container { top: 48px !important; margin-bottom: 50px !important; }
            body.mobile-typing #log-panel { height: calc(100dvh - 105px) !important; }
            body.mobile-typing #input-panel { height: 46px !important; padding: 4px 10px !important; justify-content: center !important; }
            body.mobile-typing #input-panel .panel-toggle-bar, body.mobile-typing #input-panel .quick-actions { display: none !important; }
        }

        /* 하단 제어 패널 */
        #input-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 168px;
            background: rgba(10, 15, 26, 0.85); padding: 8px 12px 12px 12px; box-sizing: border-box;
            border-top: 1px solid rgba(255, 255, 255, 0.08); z-index: 100; display: flex; flex-direction: column; justify-content: center; gap: 7px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: height 0.25s ease, padding 0.25s ease;
        }
        #input-panel.minimized { height: 44px; justify-content: flex-start; }
        #input-panel.minimized .quick-actions { display: none; }

        .panel-toggle-bar {
            display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 900px; margin: 0 auto;
        }
        .panel-toggle-title { font-size: 11px; color: #64748b; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        #btn-toggle-panel {
            background: rgba(255,255,255,0.06); color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px;
            padding: 2px 10px; font-size: 11px; font-weight: 700; cursor: pointer;
            transition: all 0.15s ease;
        }
        #btn-toggle-panel:hover { background: rgba(255,255,255,0.12); color: #fff; }

        .quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 900px; margin: 0 auto; }
        .btn-quick { 
            padding: 8px 2px; font-size: 11.5px; font-weight: 700; color: white; border: none; border-radius: 8px; 
            cursor: pointer; word-break: keep-all; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.2); 
            font-family: inherit; transition: all 0.15s ease;
        }
        .btn-quick:active { transform: scale(0.97); filter: brightness(0.9); }
        
        #btn-receipt { background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%); }       
        #btn-dispatch { background: linear-gradient(180deg, #eab308 0%, #ca8a04 100%); color: #000; }      
        #btn-arrive-action { background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%); } 
        #btn-alert { background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); }         
        #btn-chief { background: linear-gradient(180deg, #a855f7 0%, #7e22ce 100%); }         
        #btn-hq { background: linear-gradient(180deg, #ec4899 0%, #be185d 100%); }            
        #btn-chojin { background: linear-gradient(180deg, #f97316 0%, #c2410c 100%); }        
        #btn-wanjin { background: linear-gradient(180deg, #22c55e 0%, #15803d 100%); }        

        .input-row { display: flex; gap: 8px; width: 100%; max-width: 900px; margin: 0 auto; }
        input[type="text"] { 
            flex-grow: 1; padding: 9px 14px; font-size: 12.5px; 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; 
            background: rgba(15, 23, 42, 0.7); color: #fff; font-family: inherit;
            transition: all 0.2s ease;
        }
        input[type="text"]:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); background: rgba(15, 23, 42, 0.95); }
        .btn-send { 
            padding: 9px 18px; font-size: 12.5px; font-weight: 700; 
            background: linear-gradient(180deg, #475569 0%, #334155 100%); 
            color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-family: inherit; transition: all 0.15s ease;
        }
        .btn-send:hover { background: #475569; color: #38bdf8; }

        /* 차량 다중 선택 모달창 */
        #vehicle-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); z-index: 200; justify-content: center; align-items: center; }
        .modal-content { 
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px; border-radius: 14px; width: 92%; max-width: 460px; color: white; 
            max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.8); display: flex; flex-direction: column; 
        }
        .modal-header-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; margin-bottom: 12px; }
        .modal-title { font-size: 15px; font-weight: 800; color: #38bdf8; }
        .modal-top-btns { display: flex; gap: 6px; }
        .btn-mini-action { padding: 5px 10px; font-size: 11px; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; }
        .btn-mini-submit { background: #0284c7; color: white; }
        .btn-mini-close { background: rgba(255,255,255,0.1); color: #94a3b8; }
        .center-group { margin-bottom: 12px; }
        .center-title { font-size: 12.5px; font-weight: 700; color: #fbbf24; margin-bottom: 6px; }
        .veh-checkbox-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .veh-check-label { 
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); color: #f8fafc; 
            border-radius: 6px; padding: 7px 2px; font-size: 11.5px; font-weight: 600; cursor: pointer; user-select: none; 
            transition: all 0.15s ease;
        }
        .veh-check-label:hover { background: rgba(51, 65, 85, 0.8); border-color: #38bdf8; }
        .veh-check-label input[type="checkbox"] { accent-color: #0284c7; width: 14px; height: 14px; cursor: pointer; }
        .modal-footer { display: flex; gap: 8px; margin-top: 14px; }
        .btn-modal-action { flex: 1; padding: 11px; border: none; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; }
        #btn-submit-arrive { background: #0284c7; color: white; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4); }
        #btn-close-modal { background: rgba(255,255,255,0.1); color: #94a3b8; }
    </style>
</head>
<body>

    <!-- 🚒 좌측 지휘관 캐릭터 -->
    <img id="bg-captain" src="captain.png" alt="지휘관 캐릭터" onerror="this.style.display='none'">

    <!-- 좌측 상단: 초기화 버튼 + 브랜딩 -->
    <div id="top-left-group">
        <button id="btn-clear-data">🔥 초기화</button>
        <div id="header-branding">
            <img src="symbol.png" alt="소방청 심볼" onerror="this.style.display='none'">
            <span>제주소방서 현장대응단</span>
        </div>
    </div>

    <!-- 중앙 상단: 상태 바 -->
    <div id="status-board">지휘차 대기중</div>

    <!-- 우측 상단: 한글 보고서 + 잠금 모드 -->
    <div id="top-right-group">
        <button id="btn-download-hwp">📥 한글보고서</button>
        <button id="btn-lock-mode">🔓 수정 모드</button>
    </div>

    <!-- 3분할 메인 레이아웃 -->
    <div id="main-container">
        <!-- 1. 좌측 패널: 현장 정보 요약 -->
        <div class="panel-box" id="overview-panel">
            <div class="panel-header">📋 현장 정보 요약</div>
            <div class="overview-content">
                <div class="ov-section-title">📌 발생 개요</div>
                <div class="ov-row"><span class="ov-label">일시</span><textarea class="ov-input" id="ov-time" placeholder="2026. 1. 1.( 목) 14:30"></textarea></div>
                <div class="ov-row"><span class="ov-label">장소</span><textarea class="ov-input" id="ov-place" placeholder="건물명 또는 주소"></textarea></div>
                <div class="ov-row"><span class="ov-label">건물구조</span><textarea class="ov-input" id="ov-struct" placeholder="예) 철근콘크리트조 지상4층"></textarea></div>
                <div class="ov-row"><span class="ov-label">관계자</span><textarea class="ov-input" id="ov-owner" placeholder="소유자 / 관리자"></textarea></div>
                <div class="ov-row"><span class="ov-label">원인</span><textarea class="ov-input" id="ov-cause" placeholder="조사중 / 미상"></textarea></div>

                <div class="ov-section-title">⚠️ 피해 상황</div>
                <div class="ov-row"><span class="ov-label">인명피해</span><textarea class="ov-input" id="ov-casualty" placeholder="사망 0, 부상 0"></textarea></div>
                <div class="ov-row"><span class="ov-label">재산피해</span><textarea class="ov-input" id="ov-property" placeholder="조사중"></textarea></div>

                <div class="ov-section-title">🚒 동원 현황</div>
                <div class="ov-row"><span class="ov-label">동원인원</span><textarea class="ov-input" id="ov-manpower" placeholder="소방 00명 / 유관 0명"></textarea></div>
                <div class="ov-row"><span class="ov-label">동원장비</span><textarea class="ov-input" id="ov-equipment" placeholder="소방 00대 / 유관 0대"></textarea></div>

                <div class="ov-section-title">🌤️ 기상 상황</div>
                <div class="weather-grid">
                    <div class="weather-box">
                        <div class="weather-title">기온</div>
                        <input type="text" class="weather-input" id="wx-temp" placeholder="22℃">
                    </div>
                    <div class="weather-box">
                        <div class="weather-title">습도</div>
                        <input type="text" class="weather-input" id="wx-humidity" placeholder="60%">
                    </div>
                    <div class="weather-box">
                        <div class="weather-title">날씨</div>
                        <input type="text" class="weather-input" id="wx-condition" placeholder="맑음">
                    </div>
                    <div class="weather-box">
                        <div class="weather-title">풍속</div>
                        <input type="text" class="weather-input" id="wx-wind" placeholder="2.5m/s">
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. 가운데 패널: 타임라인 -->
        <div class="panel-box" id="log-panel">
            <div class="panel-header">⏱️ 타임라인</div>
            <div class="log-scroll-area" id="log-container"></div>
        </div>

        <!-- 3. 우측 패널: 현장 도착 현황 -->
        <div class="panel-box" id="arrived-vehicles-panel">
            <div class="avp-header">
                <span id="total-veh-badge">총 0대</span>
                <span class="avp-header-title">🚒 현장 도착 현황</span>
                <button id="btn-top-add-veh">+ 차량등록</button>
            </div>
            <div class="avp-content">
                <div class="avp-list-scroll" id="avp-list"></div>
            </div>
        </div>

        <div id="mobile-bottom-spacer"></div>
    </div>

    <!-- 하단 제어 패널 -->
    <div id="input-panel">
        <div class="panel-toggle-bar">
            <span class="panel-toggle-title">⚡ 빠른 지휘 제어 패널</span>
            <button id="btn-toggle-panel">▲ 패널 접기</button>
        </div>
        <div class="quick-actions">
            <button class="btn-quick" id="btn-receipt">신고 접수</button>
            <button class="btn-quick" id="btn-dispatch">출동 지령</button>
            <button class="btn-quick" id="btn-arrive-action">현장 도착</button> 
            <button class="btn-quick" id="btn-alert">대응1단계 선언</button>
            <button class="btn-quick" id="btn-chief">서장 도착</button>
            <button class="btn-quick" id="btn-hq">본부장 도착</button>
            <button class="btn-quick" id="btn-chojin">초진 선언</button>
            <button class="btn-quick" id="btn-wanjin">완진 (종료)</button>
        </div>
        <div class="input-row">
            <input type="text" id="status-input" placeholder="세부 진행상황 직접 입력">
            <button class="btn-send" id="btn-send">전파</button>
        </div>
    </div>

    <!-- 차량 다중 선택 모달창 -->
    <div id="vehicle-modal">
        <div class="modal-content">
            <div class="modal-header-top">
                <span class="modal-title">현장 도착 차량 선택</span>
                <div class="modal-top-btns">
                    <button class="btn-mini-action btn-mini-submit" id="btn-top-submit">선택완료</button>
                    <button class="btn-mini-action btn-mini-close" id="btn-top-close">닫기</button>
                </div>
            </div>
            <div id="center-list-container"></div>
            <div class="modal-footer">
                <button class="btn-modal-action" id="btn-submit-arrive">선택 완료 (일괄 등록)</button>
                <button class="btn-modal-action" id="btn-close-modal">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAT7osxJ_9xz6SexPw9ZjIuqmRm_WyXfQ",
          authDomain: "jejufire119-board.firebaseapp.com",
          databaseURL: "https://jejufire119-board-default-rtdb.firebaseio.com",
          projectId: "jejufire119-board",
          storageBucket: "jejufire119-board.firebasestorage.app",
          messagingSenderId: "144239225517",
          appId: "1:144239225517:web:4bba594247525ea4bff424"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const logsRef = database.ref('fireStationLogs');
        const statusRef = database.ref('fireStationStatus');
        const arrivedRef = database.ref('arrivedVehicles');
        const overviewRef = database.ref('fireStationOverview'); 

        const statusBoard = document.getElementById('status-board');
        const logContainer = document.getElementById('log-container');
        const inputField = document.getElementById('status-input');
        const inputPanel = document.getElementById('input-panel');
        const toggleBtn = document.getElementById('btn-toggle-panel');
        const mainContainer = document.getElementById('main-container');
        const bottomSpacer = document.getElementById('mobile-bottom-spacer');

        let logsData = []; 
        let arrivedVehicles = [];

        // 📥 한글(HWP) 보고서 파일 생성 및 다운로드 함수
        document.getElementById('btn-download-hwp').addEventListener('click', () => {
            const getVal = (id, def = "해당 없음") => {
                const el = document.getElementById(id);
                return (el && el.value.trim() !== "") ? el.value.trim() : def;
            };

            const ovTime = getVal('ov-time');
            const ovPlace = getVal('ov-place');
            const ovStruct = getVal('ov-struct');
            const ovOwner = getVal('ov-owner');
            const ovCause = getVal('ov-cause');
            const ovCasualty = getVal('ov-casualty');
            const ovProperty = getVal('ov-property');
            const ovManpower = getVal('ov-manpower');
            const ovEquipment = getVal('ov-equipment');
            const wxTemp = getVal('wx-temp', '-');
            const wxHum = getVal('wx-humidity', '-');
            const wxCond = getVal('wx-condition', '-');
            const wxWind = getVal('wx-wind', '-');

            const sortedLogs = [...logsData].sort((a, b) => (a.time || "").localeCompare(b.time || ""));
            let logRowsHtml = "";
            if (sortedLogs.length === 0) {
                logRowsHtml = `<tr><td colspan="2" style="text-align:center; padding:10px;">기록된 타임라인 내역이 없습니다.</td></tr>`;
            } else {
                sortedLogs.forEach(log => {
                    logRowsHtml += `
                        <tr>
                            <td style="text-align:center; width:22%; font-weight:bold; background:#fafafa;">[${log.time}]</td>
                            <td style="padding-left:10px;">${log.message}</td>
                        </tr>
                    `;
                });
            }

            let arrivedVehText = "없음";
            if (arrivedVehicles.length > 0) {
                const grouped = {};
                arrivedVehicles.forEach(fullName => {
                    const parts = fullName.split(' ');
                    const vehType = parts[1] || parts[0];
                    const centerName = parts[0];
                    if(!grouped[vehType]) grouped[vehType] = [];
                    grouped[vehType].push(centerName);
                });
                const summaryList = [];
                for(let type in grouped) {
                    summaryList.push(`${type} ${grouped[type].length}대(${grouped[type].join(', ')})`);
                }
                arrivedVehText = `총 ${arrivedVehicles.length}대 [ ${summaryList.join(' / ')} ]`;
            }

            const hwpTemplate = `
            <!DOCTYPE html>
            <html lang="ko">
            <head>
                <meta charset="UTF-8">
                <title>화재발생 상황보고서</title>
                <style>
                    body { font-family: '맑은 고딕', 'Malgun Gothic', '휴먼명조', serif; font-size: 11pt; line-height: 1.6; color: #000; margin: 30px; }
                    .report-title { text-align: center; font-size: 20pt; font-weight: bold; margin-bottom: 25px; letter-spacing: 2px; text-decoration: underline; }
                    .header-sub { text-align: right; font-size: 10pt; margin-bottom: 15px; color: #444; }
                    .sec-title { font-size: 13pt; font-weight: bold; margin-top: 20px; margin-bottom: 8px; color: #0f172a; border-left: 4px solid #0369a1; padding-left: 8px; }
                    table { width: 100%; border-collapse: collapse; margin-bottom: 12px; table-layout: fixed; }
                    th, td { border: 1px solid #334155; padding: 7px 10px; font-size: 10.5pt; vertical-align: middle; word-break: break-all; }
                    th { background-color: #f1f5f9; font-weight: bold; text-align: center; width: 22%; }
                    .footer-note { text-align: center; margin-top: 35px; font-size: 12pt; font-weight: bold; letter-spacing: 1px; }
                </style>
            </head>
            <body>
                <div class="report-title">화재발생 상황보고서</div>
                <div class="header-sub">제주소방서 현장대응단 | 상황발령: ${statusBoard.innerText}</div>

                <div class="sec-title">1. 발생 개요</div>
                <table>
                    <tr>
                        <th>일 시</th><td>${ovTime}</td>
                        <th>장 소</th><td>${ovPlace}</td>
                    </tr>
                    <tr>
                        <th>건물 구조</th><td>${ovStruct}</td>
                        <th>관 계 자</th><td>${ovOwner}</td>
                    </tr>
                    <tr>
                        <th>발생 원인</th><td colspan="3">${ovCause}</td>
                    </tr>
                </table>

                <div class="sec-title">2. 피해 현황</div>
                <table>
                    <tr>
                        <th>인명 피해</th><td>${ovCasualty}</td>
                        <th>재산 피해</th><td>${ovProperty}</td>
                    </tr>
                </table>

                <div class="sec-title">3. 동원 현황 및 현장 기상</div>
                <table>
                    <tr>
                        <th>동원 인원</th><td>${ovManpower}</td>
                        <th>동원 장비</th><td>${ovEquipment}</td>
                    </tr>
                    <tr>
                        <th>현장도착 차량</th><td colspan="3">${arrivedVehText}</td>
                    </tr>
                    <tr>
                        <th>현장 기상</th>
                        <td colspan="3">기온: ${wxTemp} | 습도: ${wxHum} | 날씨: ${wxCond} | 풍속: ${wxWind}</td>
                    </tr>
                </table>

                <div class="sec-title">4. 시간대별 주요 조치사항 (타임라인)</div>
                <table>
                    <thead>
                        <tr style="background:#e2e8f0;">
                            <th style="width:22%;">시 간</th>
                            <th style="width:78%;">주 요 조 치 및 상 황</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${logRowsHtml}
                    </tbody>
                </table>

                <div class="footer-note">제 주 소 방 서&nbsp;&nbsp;현 장 대 응 단</div>
            </body>
            </html>
            `;

            const blob = new Blob(['\ufeff' + hwpTemplate], { type: 'application/vnd.hancom.hwp;charset=utf-8' });
            const now = new Date();
            const dateStr = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '_' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');
            const fileName = `${dateStr}_화재발생상황보고서.hwp`;

            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        });

        // ⌨️ 모바일 키보드 포커스 최적화
        inputField.addEventListener('focus', () => {
            if (window.innerWidth <= 900) {
                document.body.classList.add('mobile-typing');
                window.scrollTo(0, 0);
            }
        });

        inputField.addEventListener('blur', () => {
            if (window.innerWidth <= 900) {
                setTimeout(() => {
                    document.body.classList.remove('mobile-typing');
                }, 150);
            }
        });

        // 🔒 화면 잠금 토글
        const lockBtn = document.getElementById('btn-lock-mode');
        let isLocked = false;
        lockBtn.addEventListener('click', () => {
            isLocked = !isLocked;
            if (isLocked) {
                document.body.classList.add('locked-mode');
                lockBtn.classList.add('active-locked');
                lockBtn.innerText = "🔒 화면 잠김";
            } else {
                document.body.classList.remove('locked-mode');
                lockBtn.classList.remove('active-locked');
                lockBtn.innerText = "🔓 수정 모드";
            }
        });

        toggleBtn.addEventListener('click', () => {
            inputPanel.classList.toggle('minimized');
            const isMin = inputPanel.classList.contains('minimized');
            if (isMin) {
                toggleBtn.innerText = "▼ 패널 펼치기";
                if (window.innerWidth > 900) {
                    mainContainer.style.bottom = "55px";
                } else if (bottomSpacer) {
                    bottomSpacer.style.height = "65px";
                }
            } else {
                toggleBtn.innerText = "▲ 패널 접기";
                if (window.innerWidth > 900) {
                    mainContainer.style.bottom = "180px";
                } else if (bottomSpacer) {
                    bottomSpacer.style.height = "185px";
                }
            }
        });

        const overviewFields = ['ov-time', 'ov-place', 'ov-struct', 'ov-owner', 'ov-cause', 'ov-casualty', 'ov-property', 'ov-manpower', 'ov-equipment', 'wx-temp', 'wx-humidity', 'wx-condition', 'wx-wind'];
        
        overviewFields.forEach(fieldId => {
            const el = document.getElementById(fieldId);
            el.addEventListener('input', () => {
                overviewRef.child(fieldId).set(el.value);
            });
        });

        overviewRef.on('value', (snapshot) => {
            const data = snapshot.val() || {};
            overviewFields.forEach(fieldId => {
                const el = document.getElementById(fieldId);
                if (document.activeElement !== el && data[fieldId] !== undefined) {
                    el.value = data[fieldId];
                }
            });
        });

        statusRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                statusBoard.innerText = data.text;
                statusBoard.style.backgroundColor = data.color;
                if (data.color.includes("red") || data.color.includes("b91c1c") || data.color.includes("dc2626")) {
                    statusBoard.classList.add('alert-level-1');
                } else {
                    statusBoard.classList.remove('alert-level-1');
                }
            } else {
                statusBoard.innerText = "지휘차 대기중";
                statusBoard.style.backgroundColor = "rgba(22, 101, 52, 0.85)";
                statusBoard.classList.remove('alert-level-1');
            }
        });

        logsRef.on('value', (snapshot) => {
            logsData = [];
            snapshot.forEach((childSnapshot) => { logsData.push(childSnapshot.val()); });
            renderLogs();
        });

        arrivedRef.on('value', (snapshot) => {
            const data = snapshot.val();
            arrivedVehicles = data ? data : [];
            renderArrivedVehicles();
            
            if (arrivedVehicles.length > 0) {
                const autoEqText = `소방 ${arrivedVehicles.length}대`;
                const eqEl = document.getElementById('ov-equipment');
                if (!eqEl.value || eqEl.value.startsWith('소방 ') || eqEl.value === '조사중') {
                    overviewRef.child('ov-equipment').set(autoEqText);
                }
            }
        });

        function addLog(message, color = "#f8fafc") {
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0') + ':' + now.getSeconds().toString().padStart(2, '0');
            const logId = Date.now().toString() + Math.random().toString().replace('.','');
            logsRef.child(logId).set({ id: logId, time: timeString, message: message, color: color });
        }

        function updateLogTime(id, newTime) {
            logsRef.child(id).update({ time: newTime });
        }

        function deleteLog(id) {
            if(confirm("이 기록을 삭제하시겠습니까?")) {
                logsRef.child(id).remove();
            }
        }

        function saveStatusState(text, color, emergencyFlag) {
            statusRef.set({ text: text, color: color, isEmergency: emergencyFlag });
        }

        const fireCenters = [
            { center: "현장대응단", v: ["지휘차"] }, { center: "이도", v: ["펌프", "물탱크", "사다리", "조연", "구급"] }, { center: "삼도", v: ["펌프", "물탱크", "구급"] },
            { center: "연동", v: ["펌프", "물탱크", "사다리", "구급"] }, { center: "오라", v: ["펌프", "물탱크", "구급"] }, { center: "항만", v: ["펌프", "화학", "구급"] },
            { center: "외도", v: ["펌프", "물탱크", "무인파괴", "구급"] }, { center: "화북", v: ["펌프", "물탱크", "고가사다리", "구급"] }, { center: "아라", v: ["펌프", "물탱크", "구급"] },
            { center: "노형", v: ["펌프", "물탱크", "구급"] }, { center: "구조대", v: ["구조차", "생활안전"] }
        ];

        const modalContainer = document.getElementById('center-list-container');
        fireCenters.forEach(fc => {
            let html = `<div class="center-group"><div class="center-title">${fc.center}</div><div class="veh-checkbox-grid">`;
            fc.v.forEach(veh => {
                const fullName = `${fc.center} ${veh}`;
                html += `
                    <label class="veh-check-label">
                        <input type="checkbox" class="veh-checkbox" value="${fullName}">
                        <span>${veh}</span>
                    </label>
                `;
            });
            html += `</div></div>`; 
            modalContainer.innerHTML += html;
        });

        const openModalFunc = () => {
            if (isLocked) return;
            document.querySelectorAll('.veh-checkbox').forEach(cb => cb.checked = false);
            document.getElementById('vehicle-modal').style.display = 'flex';
        };

        document.getElementById('btn-top-add-veh').addEventListener('click', openModalFunc);

        const closeModalFunc = () => { document.getElementById('vehicle-modal').style.display = 'none'; };
        document.getElementById('btn-close-modal').addEventListener('click', closeModalFunc);
        document.getElementById('btn-top-close').addEventListener('click', closeModalFunc);

        const submitArriveFunc = () => {
            const checkedBoxes = document.querySelectorAll('.veh-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert("등록할 차량을 하나 이상 선택해 주세요.");
                return;
            }

            let newlyAddedCount = 0;
            checkedBoxes.forEach(cb => {
                const fullName = cb.value;
                if (!arrivedVehicles.includes(fullName)) {
                    arrivedVehicles.push(fullName);
                    newlyAddedCount++;
                }
            });

            if (newlyAddedCount > 0) {
                arrivedRef.set(arrivedVehicles);
            } else {
                alert("선택하신 차량들은 이미 모두 현장 도착 처리되어 있습니다.");
            }

            document.getElementById('vehicle-modal').style.display = 'none';
        };

        document.getElementById('btn-submit-arrive').addEventListener('click', submitArriveFunc);
        document.getElementById('btn-top-submit').addEventListener('click', submitArriveFunc);

        function renderArrivedVehicles() {
            const avpList = document.getElementById('avp-list'); avpList.innerHTML = "";
            
            const totalCount = arrivedVehicles.length;
            document.getElementById('total-veh-badge').innerText = `총 ${totalCount}대`;

            if(totalCount === 0) { 
                avpList.innerHTML = "<div style='text-align:center; padding-top:30px; color:#64748b;'>도착 차량 없음</div>"; 
                return; 
            }

            const grouped = {};
            arrivedVehicles.forEach(fullName => {
                const parts = fullName.split(' '); const vehType = parts[1] || parts[0]; const centerName = parts[0];
                if(!grouped[vehType]) grouped[vehType] = []; grouped[vehType].push(centerName);
            });
            
            for(let type in grouped) {
                let html = `<div class="avp-category">${type} (${grouped[type].length}대)</div><div class="avp-grid">`;
                grouped[type].forEach(center => {
                    const fullName = `${center} ${type}`;
                    html += `<div class="avp-item" data-vehicle="${fullName}" title="클릭시 목록에서 제거">${center}</div>`; 
                });
                html += `</div>`; avpList.innerHTML += html;
            }

            document.querySelectorAll('.avp-item').forEach(item => {
                item.addEventListener('click', function() {
                    if (isLocked) return;
                    const targetVeh = this.getAttribute('data-vehicle');
                    if(confirm(`[${targetVeh}] 차량을 현장 도착 목록에서 제외하시겠습니까?`)) {
                        arrivedVehicles = arrivedVehicles.filter(v => v !== targetVeh);
                        arrivedRef.set(arrivedVehicles);
                    }
                });
            });
        }

        function renderLogs() {
            logContainer.innerHTML = ""; 

            const sortedLogs = [...logsData].sort((a, b) => {
                return (a.time || "").localeCompare(b.time || "");
            });

            sortedLogs.slice().reverse().forEach(log => {
                const newLog = document.createElement('div');
                newLog.className = 'log-entry';
                newLog.innerHTML = `
                    <div class="log-content">
                        <span class="log-time">[<span class="edit-time" contenteditable="true" data-id="${log.id}">${log.time}</span>]</span> 
                        <span class="log-msg" style="color:${log.color}">${log.message}</span>
                    </div>
                    <button class="btn-delete-log" data-id="${log.id}">삭제</button>
                `;
                logContainer.appendChild(newLog);
            });

            document.querySelectorAll('.edit-time').forEach(el => {
                el.addEventListener('blur', function() { updateLogTime(this.getAttribute('data-id'), this.innerText.trim()); });
                el.addEventListener('keypress', function(e) { if(e.key === 'Enter') { e.preventDefault(); this.blur(); } });
            });
            document.querySelectorAll('.btn-delete-log').forEach(btn => {
                btn.addEventListener('click', function() { deleteLog(this.getAttribute('data-id')); });
            });
        }

        document.getElementById('btn-send').addEventListener('click', () => {
            if (isLocked) return;
            const text = inputField.value.trim();
            if(text !== "") { 
                addLog(text, "#f8fafc"); 
                inputField.value = ""; 
            }
        });
        inputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('btn-send').click(); });

        document.getElementById('btn-receipt').addEventListener('click', () => {
            if (isLocked) return;
            saveStatusState("📞 화재 신고 접수", "#0369a1", false);
            addLog("화재 신고 접수 및 상황 전파", "#38bdf8");
        });

        document.getElementById('btn-dispatch').addEventListener('click', () => {
            if (isLocked) return;
            saveStatusState("🚨 출동 지령 하달", "#ca8a04", false);
            addLog("관할 소방대 출동 지령 하달", "#fbbf24");
        });

        document.getElementById('btn-arrive-action').addEventListener('click', () => {
            if (isLocked) return;
            saveStatusState("🚒 관할대 현장 도착", "#0284c7", false);
            addLog("관할대 현장 도착 완료", "#38bdf8");
        });

        document.getElementById('btn-alert').addEventListener('click', () => {
            if (isLocked) return;
            saveStatusState("🚨 대응 1단계 선언", "#b91c1c", true);
            addLog("대응 1단계 선언 지휘 하달", "#f87171");
        });

        document.getElementById('btn-chief').addEventListener('click', () => {
            if (isLocked) return;
            saveStatusState("🚨 소방서장 지휘권 선언", "#7c3aed", false);
            addLog("제주소방서장 현장 도착 및 지휘권 인수", "#c084fc");
        });

        document.getElementById('btn-hq').addEventListener('click', () => {
            if (isLocked) return;
            saveStatusState("🚨 본부장 지휘권 선언", "#db2777", false);
            addLog("제주소방안전본부장 현장 도착 및 지휘권 인수", "#f472b6");
        });

        document.getElementById('btn-chojin').addEventListener('click', () => {
            if (isLocked) return;
            saveStatusState("🔥 초진 완료 / 잔불 정리중", "#d97706", false);
            addLog("화세 제압 (초진 선언)", "#fbbf24");
        });

        document.getElementById('btn-wanjin').addEventListener('click', () => {
            if (isLocked) return;
            saveStatusState("✅ 완진 (상황 종료)", "rgba(22, 101, 52, 0.85)", false);
            addLog("완전 진화 및 상황 종료", "#4ade80");
        });

        // 🔒 관리자 비밀번호(0426) 초기화
        const ADMIN_PIN = "0426"; 
        document.getElementById('btn-clear-data').addEventListener('click', () => {
            if (isLocked) return;
            const inputPin = prompt("⚠️ 모든 현장 기록과 차량 현황이 영구 삭제됩니다.\n초기화 비밀번호(4자리)를 입력하세요:");
            
            if (inputPin === null) return; 
            
            if (inputPin === ADMIN_PIN) {
                if(confirm("정말로 모든 현장 기록 및 요약 정보를 초기화하시겠습니까?")) {
                    logsRef.remove(); statusRef.remove(); arrivedRef.remove(); overviewRef.remove();
                    alert("✅ 성공적으로 초기화되었습니다.");
                }
            } else {
                alert("❌ 비밀번호가 일치하지 않습니다. (초기화 취소)");
            }
        });
    </script>
</body>
